name: Nutricional
description: "Plataforma Nutricional con Menú Semanal + QR"
publish_to: 'none'
version: 1.3.5+10

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  cloud_firestore: ^6.1.1
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  firebase_messaging: ^16.1.1

  # Autenticación Social
  google_sign_in: ^6.1.5
  flutter_facebook_auth: ^6.0.0

  # Cloudinary
  cloudinary_flutter: ^1.3.0
  cloudinary_public: ^0.23.1

  # State Management
  provider: ^6.1.5+1

  # UI
  image_picker: ^1.2.1
  cached_network_image: ^3.3.1
  introduction_screen: ^4.0.0

  # Networking
  http: ^1.1.0
  connectivity_plus: ^5.0.2

  # Database Local
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.2.2

  # Seguridad
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.3

  # Notificaciones
  flutter_local_notifications: ^16.3.2
  timezone: ^0.9.4

  # QR y Scanner
  mobile_scanner: ^7.2.0

  # Utilidades
  uuid: ^4.5.1
  intl: ^0.20.3
  url_launcher: ^6.3.1

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ✅ PRUEBAS DE INTEGRACIÓN
  integration_test:
    sdk: flutter

  # ✅ PRUEBAS DE DRIVER
  flutter_driver:
    sdk: flutter

  # ✅ MOCKS Y GENERACIÓN
  mockito: ^5.4.4
  build_runner: ^2.4.11
  mocktail: ^1.0.4

  # ✅ PRUEBAS DE HTTP
  http_mock_adapter: ^0.5.0
  dio: ^5.5.0

  # ✅ PRUEBAS DE BASE DE DATOS
  sqflite_common_ffi: ^2.3.3

  # ✅ PRUEBAS DE CONECTIVIDAD
  network_info_plus: ^6.0.1

  # ✅ PRUEBAS DE IMÁGENES
  network_image_mock: ^2.1.0

  # ✅ PRUEBAS ASÍNCRONAS
  fake_async: ^1.3.1

  # ✅ COBERTURA DE CÓDIGO
  coverage: ^1.9.0

  # ✅ LINTER
  flutter_lints: ^6.0.0

  # ✅ PRUEBAS DE WIDGET
  flutter_test_robots: ^0.1.0

  # ✅ PRUEBAS GOLDEN
  alchemist: ^0.4.0
  fake_cloud_firestore: ^4.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/image/
    - assets/test_data/